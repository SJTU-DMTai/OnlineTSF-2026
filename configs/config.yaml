seed: 0

profiles: profiles.yaml

selection:
  strategy: tcn_ogd
  detector: page_hinkley

# Select with --dataset, or change data.name below. Paths are relative to this file.
# Results are written to output.directory/<dataset>.
datasets:
  etth1: ../data/ETTh1.csv
  etth2: ../data/ETTh2.csv
  ettm1: ../data/ETTm1.csv
  ettm2: ../data/ETTm2.csv
  weather: ../data/weather.csv
  traffic: ../data/traffic.csv

data:
  name: etth1
  context_length: 60
  horizon: 1
  stride: 1

offline:
  # Train on this initial share of sliding windows, then evaluate online on the remainder.
  train_ratio: 0.20
  epochs: 6
  batch_size: 32

online:
  feedback_delay: 0
  start: 0
  stop: null
  device: cuda
  keep_predictions: false

output:
  directory: ../runs
  run_name: null
  write_per_value_errors: true
