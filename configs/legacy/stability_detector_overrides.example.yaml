# Starting point for stability selection, not a validated ETTh1 calibration.
# Check alarm_events.csv and per-window alarm columns before accepting intervals.
features:
  page_hinkley:
    threshold: 200.0
  adwin:
    delta: 0.00001
  kswin:
    alpha: 0.00001

residual:
  page_hinkley:
    threshold: 100.0
  adwin:
    delta: 0.00001
  kswin:
    alpha: 0.00001

# Optional finer calibration. Later levels override only the named parameters.
# These ETTh1 values are exploratory, not validated drift/no-drift thresholds.
datasets:
  etth1:
    feature_variables:
      OT:
        kswin:
          alpha: 0.000001
    residual_models:
      lstm_ogd:
        kswin:
          alpha: 0.000001
      patchtst_ogd:
        kswin:
          alpha: 0.000001
