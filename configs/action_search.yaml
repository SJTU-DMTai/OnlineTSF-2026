# Search ranges only. Legal units and supported dimensions come from
# UpdateCapabilities in src/onlinetsf/decision/adapters.py.
search:
  # null: search all subsets; a list fixes the selected units ([] freezes).
  units: null
  # null: native scale 1; list: categorical; low/high: continuous range.
  learning_rate_scales: {low: 0.01, high: 10.0, log: true}

# strategy selects an existing profiles.yaml entry. Optional search entries
# replace individual dimensions above, e.g. search: {learning_rate_scales: null}.
methods:
  onenet:
    strategy: onenet
  fsnet:
    strategy: fsnet
  dsof:
    strategy: dlinear_dsof
