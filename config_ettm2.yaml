seed: 0

profiles: profiles.yaml

selection:
  strategy: tcn_ogd
  detector: page_hinkley

data:
  name: ettm2
  path: data/ETTm2.csv
  context_length: 60
  horizon: 1
  stride: 1

offline:
  train_ratio: 0.20
  epochs: 6
  batch_size: 32

online:
  feedback_delay: 0
  start: 0
  stop: null
  device: cuda
  keep_predictions: false

output:
  directory: runs/ettm2
  run_name: null
  write_per_value_errors: true
