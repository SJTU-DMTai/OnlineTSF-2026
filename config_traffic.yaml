seed: 0

profiles: profiles.yaml

selection:
  strategy: tcn_ogd
  detector: page_hinkley

data:
  name: traffic
  path: data/traffic.csv
  context_length: 96
  horizon: 1
  stride: 1

offline:
  train_ratio: 0.25
  epochs: 5
  batch_size: 32

online:
  feedback_delay: 0
  start: 0
  stop: null
  device: cuda
  keep_predictions: false

output:
  directory: runs/traffic
  run_name: null
  write_per_value_errors: true
