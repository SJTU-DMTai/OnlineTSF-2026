# -*- coding: utf-8 -*-
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onlinetsf"
version = "0.1.0"
description = "Minimal building blocks for online time-series forecasting research"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "PyYAML>=6.0", "river>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
capymoa = ["capymoa>=0.14"]
decision-training = ["pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
