# -*- coding: utf-8 -*-
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onlinetsf"
version = "0.1.0"
description = "Minimal building blocks for online time-series forecasting research"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "PyYAML>=6.0", "river>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
